<script>
  (function() {
    function enforceBrand() {
      const tx = document.querySelector('.brand-tx');
      if (tx && tx.textContent !== 'GAME AND LEARN') {
        tx.textContent = 'GAME AND LEARN';
      }
      const sub = document.querySelector('.brand-sub');
      if (sub && sub.textContent !== 'TRƯỜNG THCS TÂN BÌNH') {
        sub.textContent = 'TRƯỜNG THCS TÂN BÌNH';
      }
      const hsb = document.querySelector('.hsb-name');
      if (hsb && hsb.textContent.trim() !== 'TRƯỜNG THCS TÂN BÌNH') {
        hsb.textContent = 'TRƯỜNG THCS TÂN BÌNH';
      }
      const hcpBadge = document.querySelector('.hcp-badge b');
      if (hcpBadge && hcpBadge.textContent !== 'Ms Trúc') {
        hcpBadge.textContent = 'Ms Trúc';
      }
      const phoneItem = document.querySelector('.hcp-item[href*="tel"]');
      if (phoneItem) {
        phoneItem.href = 'tel:0908959627';
        phoneItem.title = 'Gọi điện cho Ms Trúc: 0908.959.627';
        const span = phoneItem.querySelector('span:last-child');
        if (span) span.textContent = '0908.959.627';
      }
      const zaloItem = document.querySelector('.hcp-item[href*="zalo"]');
      if (zaloItem) {
        zaloItem.href = 'https://zalo.me/0908959627';
        zaloItem.title = 'Chat Zalo với Ms Trúc';
      }
      const mailItem = document.querySelector('.hcp-item[href*="mailto"], a.email');
      if (mailItem) {
        mailItem.href = 'mailto:tranthithanhtruc1980@gmail.com';
        mailItem.title = 'Gửi email cho Ms Trúc: tranthithanhtruc1980@gmail.com';
      }
      document.querySelectorAll('img[src*="thanhbinh"], .brand-logo img, .sp-logo img, .hsb-logo img').forEach(function(img) {
        if (!img.src.includes('logo-thcs-tan-binh') && !img.src.includes('logo.png')) {
          img.src = '/logo-thcs-tan-binh.jpg';
        }
      });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', enforceBrand);
    } else {
      enforceBrand();
    }
    setInterval(enforceBrand, 150);
  })();
</script>
